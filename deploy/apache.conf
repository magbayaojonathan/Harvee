ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    <FilesMatch "(?i)^(\.|.*\.(sql|log|md|ya?ml|ini|sh|json|lock)$|Dockerfile)">
        Require all denied
    </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/html/(config|database|deploy|tests|\.git)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /var/data/uploads>
    Options -Indexes -ExecCGI
    Require all granted
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|pl|sh)$">
        Require all denied
    </FilesMatch>
</Directory>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
