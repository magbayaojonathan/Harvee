databases:
  - name: harvee-db
    databaseName: harvee_marketplace
    user: harvee
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
services:
  - type: web
    name: harvee
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health.php
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: harvee-db
          property: connectionString
