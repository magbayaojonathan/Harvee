databases:
  - name: harvee-db
    databaseName: harvee_marketplace
    user: harvee
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
services:
  - type: web
    name: harvee
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /health.php
    disk:
      name: harvee-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: harvee-db
          property: connectionString
